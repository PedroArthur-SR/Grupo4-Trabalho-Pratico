<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar Consulta - Sistema Hospitalar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="logo">✚</span><div>SIH<small>Sistema Hospitalar</small></div></div>
    <nav>
      <a href="index.html">Painel</a>
      <a href="pacientes.html">Pacientes</a>
      <a href="profissionais.html">Profissionais</a>
      <a href="consultas.html" class="active">Consultas</a>
      <a href="internacoes.html">Internações</a>
      <a href="quartos.html">Quartos</a>
      <a href="historico.html">Histórico Médico</a>
    </nav>
  </aside>

  <main>
    <div class="page-header">
      <div>
        <p class="breadcrumb"><a href="consultas.html">Consultas</a> / Agendar</p>
        <h1>Agendar Consulta</h1>
      </div>
    </div>

    <form class="card">
      <div class="alert alert-info">
        Um profissional não pode ter dois atendimentos agendados no mesmo horário.
      </div>

      <div class="form-grid">
        <div class="field">
          <label for="paciente">Paciente <span class="required">*</span></label>
          <select id="paciente">
            <option value="">Selecione o paciente...</option>
            <option>Ana Souza - 123.456.789-00</option>
            <option>João Pereira - 987.654.321-00</option>
            <option>Beatriz Rocha - 456.789.123-00</option>
          </select>
        </div>
        <div class="field">
          <label for="profissional">Profissional responsável <span class="required">*</span></label>
          <select id="profissional">
            <option value="">Selecione o profissional...</option>
            <option>Dr. Carlos Lima - Cardiologia</option>
            <option>Dra. Marina Alves - Clínica Geral</option>
            <option>Dr. Rafael Costa - Ortopedia</option>
          </select>
        </div>
        <div class="field">
          <label for="data">Data <span class="required">*</span></label>
          <input type="date" id="data">
        </div>
        <div class="field">
          <label for="horario">Horário <span class="required">*</span></label>
          <input type="time" id="horario" step="1800">
        </div>
        <div class="field full">
          <label for="motivo">Motivo da consulta <span class="required">*</span></label>
          <input type="text" id="motivo" placeholder="Ex.: Dor no peito, retorno, check-up">
        </div>
        <div class="field full">
          <label for="observacoes">Observações médicas</label>
          <textarea id="observacoes" placeholder="Preenchido pelo profissional durante ou após o atendimento"></textarea>
        </div>
      </div>

      <div class="form-actions">
        <a href="consultas.html" class="btn">Cancelar</a>
        <button type="button" class="btn btn-primary">Agendar consulta</button>
      </div>
    </form>
  </main>
</body>
</html>
